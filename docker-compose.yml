# Sobe so a API do servico. O banco e a mensageria entram no compose junto com
# as tasks que os introduzem (LocalStack para SQS/SNS/DynamoDB, ver ADR-0005).
services:
  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      target: runtime
    image: fiap-techchallenge-oficina-mecanica-billing:latest
    container_name: oficina-mecanica-billing-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DynamoDb__Region: us-east-1
      DynamoDb__ServiceUrl: http://host.docker.internal:4566
      DynamoDb__TableName: oficina-billing
      DynamoDb__CreateTableIfMissing: "true"
      Messaging__Enabled: "true"
      Messaging__Region: us-east-1
      Messaging__ServiceUrl: http://host.docker.internal:4566
      Messaging__DiagnosticoConcluidoQueueUrl: http://host.docker.internal:4566/000000000000/billing-diagnostico-concluido
      Messaging__EventosTopicArn: arn:aws:sns:us-east-1:000000000000:oficina-eventos
      AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY_ID:?Defina LOCALSTACK_ACCESS_KEY_ID no arquivo .env}
      AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_ACCESS_KEY:?Defina LOCALSTACK_SECRET_ACCESS_KEY no arquivo .env}
      # A imagem roda com o Datadog Tracer habilitado, mas o compose local nao
      # sobe um Datadog Agent.
      DD_TRACE_ENABLED: "false"
    ports:
      - "${API_PORT:-8081}:8080"
    restart: unless-stopped
