apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-billing
  labels:
    app: oficina-mecanica-billing
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-mecanica-billing
  template:
    metadata:
      labels:
        app: oficina-mecanica-billing
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: api
          image: oficina-mecanica-billing
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-mecanica-billing-config
            # Montado pela pipeline a partir do Secrets Manager (input segredos);
            # nunca versionado. Sem ele o pod nao sobe, o que e o desejado.
            - secretRef:
                name: oficina-mecanica-billing-secret
          env:
            - name: DD_SERVICE
              value: oficina-mecanica-billing
            - name: DD_ENV
              value: __AMBIENTE__
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # readiness inclui as dependencias; liveness so confere o processo,
          # para uma dependencia fora do ar nao reiniciar o pod a toa.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Request de memoria igual ao do OS Service (256Mi). Com 128Mi o HPA via
          # 81% de uso medio so com o runtime do .NET subido, acima do alvo de 75%,
          # e escalava sem carga (ensaio de 09/11 no dev, F4-38). Limit segue 512Mi.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
