# Manifests do Billing Service no EKS, no mesmo namespace do OS Service.
#
# A imagem vem do ECR com tag igual ao SHA do commit. O deploy substitui o valor
# abaixo; o placeholder nunca e aplicado como esta.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-mecanica

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

images:
  - name: oficina-mecanica-billing
    newName: oficina-mecanica-billing
    newTag: placeholder

# DD_VERSION (unified service tagging, F4-31) = tag da imagem, que o deploy ja
# troca pelo SHA do commit. A replacement roda depois do transformer de images e
# copia o valor final para os labels tags.datadoghq.com/version do Deployment e
# do pod; o container le o label por fieldRef. Assim o deploy nao precisa de
# mais um placeholder para substituir.
replacements:
  - source:
      kind: Deployment
      name: oficina-mecanica-billing
      fieldPath: spec.template.spec.containers.[name=api].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: oficina-mecanica-billing
        fieldPaths:
          - metadata.labels.[tags.datadoghq.com/version]
          - spec.template.metadata.labels.[tags.datadoghq.com/version]
